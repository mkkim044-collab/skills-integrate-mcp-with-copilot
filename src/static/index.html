<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="header-content">
        <div>
          <h1>Mergington High School</h1>
          <h2>Extracurricular Activities</h2>
        </div>
        <div class="header-actions">
          <div class="auth-menu">
            <button
              id="auth-button"
              class="tools-button"
              type="button"
              aria-label="Open teacher login"
              aria-expanded="false"
              aria-controls="auth-panel"
              title="Teacher login"
            >
              👤
            </button>
            <div id="auth-panel" class="auth-panel hidden">
              <p id="auth-status">Teacher login</p>
              <form id="login-form">
                <label for="username">Username</label>
                <input id="username" name="username" autocomplete="username" required />
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required />
                <button type="submit">Log in</button>
              </form>
              <button id="logout-button" class="secondary-button hidden" type="button">Log out</button>
              <p id="auth-message" class="auth-message hidden"></p>
            </div>
          </div>
          <div class="tools-menu">
            <button
              id="tools-button"
              class="tools-button"
              type="button"
              aria-label="Open additional tools"
              aria-expanded="false"
              aria-controls="tools-panel"
              title="Additional tools"
            >
              🛠️
            </button>
            <div id="tools-panel" class="tools-panel hidden" role="menu">
              <button id="refresh-button" type="button" role="menuitem">↻ Refresh activities</button>
              <button id="available-only-button" type="button" role="menuitem">✓ Show available only</button>
              <button id="reset-form-button" type="button" role="menuitem">× Reset sign-up form</button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div class="activity-filters" aria-label="Activity filters">
          <label for="activity-search">Search</label>
          <input id="activity-search" type="search" placeholder="Search activities" />
          <label for="category-filter">Category</label>
          <select id="category-filter">
            <option value="">All categories</option>
          </select>
          <label for="sort-activities">Sort</label>
          <select id="sort-activities">
            <option value="name">Name</option>
            <option value="schedule">Schedule</option>
            <option value="availability">Availability</option>
          </select>
        </div>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container" class="hidden">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
